name: building-agent-aca-landing-zone

metadata:
  template: building-agent-aca-landing-zone@0.0.1

infra:
  provider: bicep
  path: infra/aca-lza
  module: ./main
  deploymentScope: subscription

# Hooks for pre/post deployment actions
hooks:
  preprovision:
    posix:
      shell: sh
      run: |
        echo "Validating Azure subscription and permissions..."
    windows:
      shell: pwsh
      run: |
        Write-Host "Validating Azure subscription and permissions..."

  postprovision:
    posix:
      shell: sh
      run: |
        echo "ACA deployment complete! Review outputs for key information."
    windows:
      shell: pwsh
      run: |
        Write-Host "ACA deployment complete! Review outputs for key information."
